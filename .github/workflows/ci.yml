name: CI

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1

  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      # Non-mutating check. JuliaFormatter 2.x ignores `check=true` (it reformats in place and
      # exits 0), so use `overwrite=false` and fail on a `false` result. Install into a temporary
      # environment so the project's Project.toml is never modified.
      - name: Check formatting
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp = true)
            Pkg.add(name = "JuliaFormatter", version = "2")
            using JuliaFormatter
            @info "JuliaFormatter" pkgversion(JuliaFormatter)
            if !format("."; overwrite = false, verbose = true)
                @error "Files are not formatted. Run JuliaFormatter locally (see AGENTS.md)."
                exit(1)
            end'
